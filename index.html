<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมจับคู่การ์ดสัตว์แสนสนุก | Animal Matching Game</title>
    <!-- Google Fonts: Outfit for numbers, Prompt for Thai text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Confetti canvas for victory animation -->
    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">🐼 จับคู่การ์ดสัตว์แสนสนุก 🐶</h1>
            <div class="dashboard">
                <div class="stat-card">
                    <span class="stat-label">เวลา</span>
                    <span id="timer-val" class="stat-value">00:00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">การเดิน (ครั้ง)</span>
                    <span id="moves-val" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">ดีที่สุด</span>
                    <span id="best-val" class="stat-value">-</span>
                </div>
                <button id="reset-btn" class="reset-button" aria-label="เริ่มเกมใหม่">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span>เริ่มใหม่</span>
                </button>
            </div>
        </header>

        <main class="board-container">
            <div id="game-board" class="game-board">
                <!-- Cards will be dynamically inserted here by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-emoji">🎉🏆✨</div>
            <h2>ยินดีด้วย! คุณชนะแล้ว!</h2>
            <p class="modal-subtitle">จับคู่การ์ดสัตว์ได้ครบทั้งหมด 12 คู่เรียบร้อย</p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="modal-stat-label">เวลาที่ใช้</span>
                    <span id="modal-time" class="modal-stat-value">00:00</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-label">การเดินทั้งหมด</span>
                    <span id="modal-moves" class="modal-stat-value">0</span>
                </div>
            </div>
            <button id="replay-btn" class="replay-button">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
